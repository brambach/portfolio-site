<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4d5e0" />
    <script>
      // Paint the page's paper before anything loads, so there's no flash of another color. The site's pages are
      // / and /projects/<id>, and anything else that isn't one of the older pages is its not-found page. Mirrors
      // siteRoute in src/site/routes.ts, and PALETTES and timeOf in src/site/palette.ts.
      (function () {
        var path = location.pathname.replace(/\/+$/, '');
        var q = new URLSearchParams(location.search);
        var older = ['/work', '/drive', '/next', '/admin', '/previous', '/entrance-still', '/project-lab'];
        var moving = path === '/projects' || path === '/lab' || path.indexOf('/lab/') === 0;
        // When the browser can't run a page-to-page fade it drops it: "skipped" (AbortError), or "aborted because of
        // invalid state" (InvalidStateError) when the screen changed size on the way, as a phone's toolbar does. If
        // it drops it before the page is handed the transition, nothing can catch its promises, so they arrive
        // here. Only those two, and only from a transition: anything else is still reported.
        addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          if (r && ((r.name === 'AbortError' && /skipped/i.test(r.message)) || (r.name === 'InvalidStateError' && /transition/i.test(r.message)))) e.preventDefault();
        });
        var site = window.__notFound || moving || (path === ''
          ? !['mile', 'from', 'town', 'city', 'journey', 'forest'].some(function (k) { return q.has(k); })
          : older.indexOf(path) < 0);
        if (!site) return;
        var raw = q.get('hour'), m = raw && /^(\d{1,2})(?::(\d{2}))?$/.exec(raw), now = new Date();
        var h = raw === null ? NaN : m ? Number(m[1]) + (m[2] ? Number(m[2]) / 60 : 0) : Number(raw);
        if (!(h >= 0 && h <= 24)) h = now.getHours() + now.getMinutes() / 60;
        var time = h >= 5 && h < 10 ? 'dawn' : h >= 10 && h < 16 ? 'day' : h >= 16 && h < 19.5 ? 'golden' : 'night';
        var paper = { dawn: '#f4d5e0', day: '#eef2ee', golden: '#f6e0c6', night: '#0a0f26' }[time];
        var root = document.documentElement;
        root.setAttribute('data-e', time);
        root.style.background = paper;
        root.style.setProperty('--e-paper', paper);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', paper);
        // Arriving on a project's page with the dots handed over (src/site/chrome.ts): hold the page before on
        // screen until the dots are drawn here, then the page lets it go. Never longer than the hold below.
        var work = /^\/projects\/[^/]+$/.test(path);
        if (work && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
          try {
            var note = JSON.parse(sessionStorage.getItem('e:handoff') || 'null');
            if (note && Date.now() - note.at < 5000 && path.split('/').pop() === note.id) {
              root.setAttribute('data-e-arriving', '');
              addEventListener('pagereveal', function (e) {
                var t = e.viewTransition;
                window.__eReveal = t;
                if (t) [t.ready, t.finished, t.updateCallbackDone].forEach(function (p) { if (p) p.catch(function () {}); });
              });
            }
          } catch (e) {}
        }
      })();
    </script>
    <style>
      :root[data-e="night"] { color-scheme: dark; }
      :root[data-e-arriving]::view-transition-old(root) { animation: e-vt-hold 2s linear both; }
      :root[data-e-arriving]::view-transition-new(root) { animation: e-vt-wait 2s linear both; }
      @keyframes e-vt-hold { from, to { opacity: 1; } }
      @keyframes e-vt-wait { from, to { opacity: 0; } }
    </style>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=e1" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=e1" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Sentient, the display face, comes from Fontshare (its licence doesn't allow the files in a public repo).
         Loaded without blocking the page; the stylesheets fall back to Georgia until it arrives. -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=sentient@400,400i&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=sentient@400,400i&display=swap" /></noscript>
    <meta name="author" content="Bryce Rambach" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Bryce Rambach",
        "url": "https://brycerambach.com",
        "sameAs": ["https://github.com/brambach", "https://x.com/brycerambach", "https://www.linkedin.com/in/bryce-rambach/"],
        "jobTitle": "Software engineer"
      }
    </script>
    <!-- page-meta -->
    <title>Bryce Rambach</title>
    <!-- /page-meta -->
    <script>
      // Cross-page fades (see index.css) are a nicety: when the browser skips one, say nothing.
      for (const type of ['pageswap', 'pagereveal']) {
        addEventListener(type, (event) => {
          const t = event.viewTransition;
          if (t) for (const p of [t.ready, t.finished, t.updateCallbackDone]) p?.catch(() => {});
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
