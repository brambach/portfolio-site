<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4d5e0" />
    <script>
      // Paint the page's paper before anything loads, so there's no flash of another color. The site's pages are
      // / and /projects/<id>, and anything else that isn't one of the older pages is its not-found page. Mirrors
      // siteRoute in src/site/routes.ts, and PALETTES and timeOf in src/site/palette.ts.
      (function () {
        var path = location.pathname.replace(/\/+$/, '');
        var q = new URLSearchParams(location.search);
        var older = ['/work', '/drive', '/next', '/admin', '/previous', '/entrance-still', '/project-lab'];
        var moving = path === '/projects' || path === '/lab' || path.indexOf('/lab/') === 0;
        // When the browser can't run a page-to-page fade it drops it: "skipped" (AbortError), or "aborted because of
        // invalid state" (InvalidStateError) when the screen changed size on the way, as a phone's toolbar does. If
        // it drops it before the page is handed the transition, nothing can catch its promises, so they arrive
        // here. Only those two, and only from a transition: anything else is still reported.
        addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          if (r && ((r.name === 'AbortError' && /skipped/i.test(r.message)) || (r.name === 'InvalidStateError' && /transition/i.test(r.message)))) e.preventDefault();
        });
        var site = window.__notFound || moving || (path === ''
          ? !['mile', 'from', 'town', 'city', 'journey', 'forest'].some(function (k) { return q.has(k); })
          : older.indexOf(path) < 0);
        // A project's page wears the home's cream paper and faces (src/site/project.css).
        var work = !window.__notFound && /^\/projects\/(dervo|arro|port|lucid|integration-portal|agentsky)$/.test(path);
        // Sentient, the display face of the not-found page (src/site/e.css), comes from Fontshare (its licence
        // doesn't allow the files in a public repo). The home and the project pages are set in their own
        // self-hosted faces, and the older pages bring their own (/next asks for Sentient itself, in QuietIndex.tsx),
        // so only this page asks for it. Added from here it doesn't block the page; the stylesheets fall back to
        // Georgia until it arrives.
        if (site && !work && (path !== '' || window.__notFound)) {
          [['preconnect', 'https://api.fontshare.com'], ['preconnect', 'https://cdn.fontshare.com'],
           ['stylesheet', 'https://api.fontshare.com/v2/css?f[]=sentient@400,400i&display=swap']].forEach(function (l) {
            var link = document.createElement('link');
            link.rel = l[0];
            link.href = l[1];
            if (l[0] === 'preconnect') link.crossOrigin = '';
            document.head.appendChild(link);
          });
        }
        if (!site) return;
        var root = document.documentElement;
        var meta = document.querySelector('meta[name="theme-color"]');
        if ((path === '' || work) && !window.__notFound) {
          // The home's faces for the first screen (a project page's too), preloaded here and nowhere else: its CSS arrives with its chunk, after
          // the JS, so without this the headline would wait on a round trip it doesn't need. The build fills the
          // list (vite.config.ts).
          [/* home-fonts */].forEach(function (href) {
            var link = document.createElement('link');
            link.rel = 'preload';
            link.as = 'font';
            link.type = 'font/woff2';
            link.crossOrigin = '';
            link.href = href;
            document.head.appendChild(link);
          });
          root.style.background = '#f3eee3';
          if (meta) meta.setAttribute('content', '#f3eee3');
          return;
        }
        var raw = q.get('hour'), m = raw && /^(\d{1,2})(?::(\d{2}))?$/.exec(raw), now = new Date();
        var h = raw === null ? NaN : m ? Number(m[1]) + (m[2] ? Number(m[2]) / 60 : 0) : Number(raw);
        if (!(h >= 0 && h <= 24)) h = now.getHours() + now.getMinutes() / 60;
        var time = h >= 5 && h < 10 ? 'dawn' : h >= 10 && h < 16 ? 'day' : h >= 16 && h < 19.5 ? 'golden' : 'night';
        // The not-found page keeps the day paper at every hour, so nothing the home links to turns dark at night
        // (NotFound.tsx does the same).
        if (!moving) time = 'day';
        var paper = { dawn: '#f4d5e0', day: '#eef2ee', golden: '#f6e0c6', night: '#0a0f26' }[time];
        root.setAttribute('data-e', time);
        root.style.background = paper;
        root.style.setProperty('--e-paper', paper);
        if (meta) meta.setAttribute('content', paper);
      })();
    </script>
    <style>
      :root[data-e="night"] { color-scheme: dark; }
    </style>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=e1" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=e1" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="author" content="Bryce Rambach" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Bryce Rambach",
        "url": "https://brycerambach.com",
        "sameAs": ["https://github.com/brambach", "https://x.com/brycerambach", "https://www.linkedin.com/in/bryce-rambach/"],
        "jobTitle": "Software engineer"
      }
    </script>
    <!-- page-meta -->
    <title>Bryce Rambach</title>
    <!-- /page-meta -->
    <script>
      // Cross-page fades (see index.css) are a nicety: when the browser skips one, say nothing.
      for (const type of ['pageswap', 'pagereveal']) {
        addEventListener(type, (event) => {
          const t = event.viewTransition;
          if (t) for (const p of [t.ready, t.finished, t.updateCallbackDone]) p?.catch(() => {});
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
