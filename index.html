<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Paint the sky before anything loads on the sky site's addresses, so there's no paper flash.
      // Mirrors isSkyPath in src/sky/routes.ts.
      (function () {
        var path = location.pathname.replace(/\/$/, '');
        var q = new URLSearchParams(location.search);
        var drive = ['from', 'town', 'city', 'journey', 'forest'].some(function (k) { return q.has(k); });
        var ids = ['dervo', 'arro', 'port'];
        var project = /^\/projects\/([^/]+)$/.exec(path);
        var sky = !q.has('look') && ((path === '' && !q.has('mile') && !drive) || (project && ids.indexOf(project[1]) >= 0));
        if (sky) document.documentElement.setAttribute('data-sky', '');
        if (/^\/lab(\/[a-e])?$/.test(path)) document.documentElement.setAttribute('data-lab', '');
        // Lab E is on paper the color of the visitor's time of day. Mirrors PALETTES and timeOf in src/lab/e/palette.ts.
        if (path === '/lab/e') {
          var raw = q.get('hour'), m = raw && /^(\d{1,2})(?::(\d{2}))?$/.exec(raw), now = new Date();
          var h = raw === null ? NaN : m ? Number(m[1]) + (m[2] ? Number(m[2]) / 60 : 0) : Number(raw);
          if (!(h >= 0 && h <= 24)) h = now.getHours() + now.getMinutes() / 60;
          var paper = h >= 5 && h < 10 ? '#f4d5e0' : h >= 10 && h < 16 ? '#eef2ee' : h >= 16 && h < 19.5 ? '#f6e0c6' : '#0a0f26';
          document.documentElement.style.background = paper;
        }
      })();
    </script>
    <style>
      :root[data-sky], :root[data-lab] { background: #090f1c; color-scheme: dark; }
      :root[data-sky] body { background: linear-gradient(#090f1c, #161621 28%, #14171e 72%, #27171a); }
    </style>

      for (const type of ['pageswap', 'pagereveal']) {
        addEventListener(type, (event) => {
          const t = event.viewTransition;
          if (t) for (const p of [t.ready, t.finished, t.updateCallbackDone]) p?.catch(() => {});
