<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Paint the sky before anything loads on the sky site's addresses, so there's no paper flash.
      // Mirrors isSkyPath in src/sky/routes.ts.
      (function () {
        var path = location.pathname.replace(/\/$/, '');
        var q = new URLSearchParams(location.search);
        var drive = ['from', 'town', 'city', 'journey', 'forest'].some(function (k) { return q.has(k); });
        var ids = ['dervo', 'integration-portal', 'lucid', 'arro', 'port', 'agentsky'];
        var project = /^\/projects\/([^/]+)$/.exec(path);
        var sky = !q.has('look') && ((path === '' && !q.has('mile') && !drive) || (project && ids.indexOf(project[1]) >= 0));
        if (sky) document.documentElement.setAttribute('data-sky', '');
      })();
    </script>
    <style>
      :root[data-sky] { background: #090f1c; color-scheme: dark; }
      :root[data-sky] body { background: linear-gradient(#090f1c, #161621 28%, #14171e 72%, #27171a); }
    </style>

    <script>
      // Cross-page fades (see index.css) are a nicety: when the browser skips one, say nothing.
      for (const type of ['pageswap', 'pagereveal']) {
        addEventListener(type, (event) => {
          const t = event.viewTransition;
          if (t) for (const p of [t.ready, t.finished, t.updateCallbackDone]) p?.catch(() => {});
        });
      }
